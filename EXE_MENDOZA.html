<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Popular Search Engines</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 40px;
        }

        .container {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
        }

        h2 {
            margin-top: 0;
        }

        ol {
            font-size: 18px;
            line-height: 1.7;
        }

        a {
            color: black;
            text-decoration: none;
        }

        a:hover {
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Popular Search Engines:</h2>

        <ol>
            <li>
                <a href="https://www.yahoo.com" target="_blank">
                    Yahoo
                </a>
            </li>

            <li>
                <a href="https://www.google.com" target="_blank">
                    Google
                </a>
            </li>

            <li>
                <a href="https://www.bing.com" target="_blank">
                    Bing
                </a>
            </li>

            <li>
                <a href="https://www.youtube.com" target="_blank">
                    Youtube
                </a>
            </li>

            <li>
                <a href="https://www.microsoft.com" target="_blank">
                    Microsoft
                </a>
            </li>
        </ol>

    </div>

</body>
</html>
