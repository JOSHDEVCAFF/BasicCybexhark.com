<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-Classroom Overview</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 80%;
            max-width: 750px;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #4b3f9e;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 35px;
        }

        .content-box {
            background: #f7f5ff;
            padding: 25px;
            border-radius: 15px;
            border-left: 6px solid #667eea;
            overflow: hidden; /* Clears float */
        }

        .left-image {
            float: left;
            width: 180px;
            height: 130px;
            object-fit: cover;
            margin-right: 20px;
            margin-bottom: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .content-box p {
            font-size: 18px;
            color: #333;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Gym</h1>

        <p class="subtitle">
            Creating a website project to showcase gym equipment and supplements.
        </p>

        <div class="content-box">
            <img src="gym.png" alt="E-Classroom Students" class="left-image">
            <p>
                My very first develop website project in Senior High School, The website I created
                is about gym equipments and supplements. I used HTML and CSS to design the website, making it visually appealing and user-friendly.
            </p>
        </div>

    </div>

</body>
</html>
