<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popular Search Engines</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255,255,255,0.9), transparent 30%),
                radial-gradient(circle at bottom right, rgba(125, 211, 252, 0.5), transparent 25%),
                linear-gradient(135deg, #dbeafe, #e9d5ff, #c7d2fe);
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 560px;
            padding: 30px 28px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 22px;
            box-shadow: 0 20px 45px rgba(79, 70, 229, 0.18);
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: -60px;
            right: -60px;
            width: 180px;
            height: 180px;
            background: rgba(96, 165, 250, 0.15);
            border-radius: 50%;
        }

        .container::after {
            content: "";
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 150px;
            height: 150px;
            background: rgba(168, 85, 247, 0.10);
            border-radius: 50%;
        }

        h2 {
            position: relative;
            margin: 0 0 22px;
            text-align: center;
            font-size: 2.1rem;
            color: #312e81;
            letter-spacing: 1px;
            z-index: 1;
        }

        ol {
            position: relative;
            list-style: none;
            margin: 0;
            padding: 0;
            z-index: 1;
        }

        li {
            margin: 12px 0;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-radius: 14px;
            color: #1f2937;
            text-decoration: none;
            font-weight: 700;
            background: linear-gradient(135deg, #f8fafc, #eef2ff);
            border: 1px solid rgba(99, 102, 241, 0.08);
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
            transition: all 0.25s ease;
        }

        a::before {
            content: counter(list-item);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            margin-right: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 0.9rem;
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.3);
        }

        a:hover {
            background: linear-gradient(135deg, #eef2ff, #e0e7ff);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 12px 22px rgba(79, 70, 229, 0.15);
            color: #312e81;
        }

        a:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Popular Search Engines</h2>

        <ol>
            <li><a href="https://www.yahoo.com" target="_blank">Yahoo</a></li>
            <li><a href="https://www.google.com" target="_blank">Google</a></li>
            <li><a href="https://www.bing.com" target="_blank">Bing</a></li>
            <li><a href="https://www.youtube.com" target="_blank">Youtube</a></li>
            <li><a href="https://www.microsoft.com" target="_blank">Microsoft</a></li>
        </ol>
    </div>

</body>
</html>
